name: Summarize current Opire frontend rewards

on:
  push:
    branches:
      - research/opire-bounties-20260819

permissions:
  contents: write

jobs:
  summarize:
    if: ${{ !contains(github.event.head_commit.message, '[opire summary built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opire-bounties-20260819

      - name: Build compact candidate summaries
        shell: bash
        run: |
          jq '
            map({
              title,
              url,
              priceUSD: (.pendingPrice.value / 100),
              trying: (.tryingUsers | length),
              claimed: (.claimerUsers | length),
              programmingLanguages,
              organization: .organization.name,
              project: .project.name,
              botInstalled: .project.isBotInstalled,
              createdAt
            })
            | sort_by(.priceUSD)
            | reverse
          ' research/opire-frontend-all.json > research/opire-frontend-summary.json

          jq '
            map(select(.trying <= 3 and .priceUSD >= 20))
          ' research/opire-frontend-summary.json > research/opire-frontend-low-competition.json

      - name: Commit summaries
        run: |
          git config user.name 'obmakesomething'
          git config user.email '107823004+obmakesomething@users.noreply.github.com'
          git add research/opire-frontend-summary.json research/opire-frontend-low-competition.json
          git commit -m 'research: add compact Opire candidate summaries [opire summary built]'
          git push origin HEAD:research/opire-bounties-20260819
